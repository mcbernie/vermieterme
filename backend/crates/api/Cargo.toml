[package]
name = "vermieterme-api"
description = "HTTP layer and binary of vermieterme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vermieterme"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
bcrypt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
vermieterme-db = { workspace = true }
vermieterme-domain = { workspace = true }

[dev-dependencies]
# Enables the test databases (`TestDb`, `dual_test!`) for the integration tests.
vermieterme-db = { workspace = true, features = ["testing"] }
